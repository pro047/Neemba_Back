name: neemba
networks:
  appnet:
    driver: bridge

volumes:
  nats-data:
  pg-data:
  monitor-state:
  prometheus-data:
  grafana-data:

services:
  # 알림 사이드카: 앱 /metrics 폴링 → 규칙 판정(상태 전이 dedup) → 디스코드.
  # docker.sock 미사용(저장소 보안 결정) — pg-retention 과 같은
  # 'stock 이미지 + ro 스크립트 마운트' 관례. DISCORD_WEBHOOK_URL 은
  # .env.prod(ENV_PROD 시크릿)에서 오며, 없으면 로그 전용으로 동작.
  monitor:
    image: python:3.12-alpine
    container_name: monitor
    entrypoint: ["python", "/usr/local/bin/monitor.py"]
    volumes:
      - ./infra/monitor/monitor.py:/usr/local/bin/monitor.py:ro
      - monitor-state:/var/lib/monitor
    env_file:
      - .env.prod
    depends_on:
      - python
      - node
    networks:
      - appnet
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    # Self-reload every 12h so renewed certbot certificates get picked up
    # without the docker.sock-mounted reloader sidecar (removed — it was
    # effectively host-root). Certs renew ~30 days before expiry, so a
    # worst-case 12h pickup delay is harmless.
    command: >
      sh -c '(while :; do sleep 12h; nginx -s reload && echo "[cert-reload] nginx reloaded"; done) &
            exec nginx -g "daemon off;"'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/letsencrypt:/etc/letsencrypt
      - ./infra/nginx/html:/var/www/html
      # Monitor Basic Auth htpasswd (Phase 7) — same secrets dir as node/python,
      # never committed. Create with: htpasswd -B -c monitor.htpasswd <user>
      - /var/lib/neemba/secrets:/var/lib/neemba/secrets:ro
    restart: unless-stopped
    networks:
      - appnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rtmp:
    image: alfg/nginx-rtmp
    container_name: rtmp
    # nginx-rtmp resolves the on_publish host at config-parse time, so the
    # node container must exist (its DNS entry with it) before nginx starts —
    # otherwise nginx exits with [emerg] host not found and crash-loops.
    depends_on:
      - node
    ports:
      - "1935:1935"
    volumes:
      - ./infra/rtmp/nginx.conf:/etc/nginx/nginx.conf.template:ro
    entrypoint: >
      sh -c "envsubst < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf &&
            nginx -g 'daemon off;'"
    networks:
      - appnet
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./infra/letsencrypt:/etc/letsencrypt
      - ./infra/nginx/html:/var/www/html
    # Renews cert files only — nginx picks them up via its own periodic
    # reload (see the nginx service command).
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/html --quiet; sleep 12h & wait $${!}; done'
    networks:
      - appnet
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  node:
    build:
      context: ./services/node
      dockerfile: Dockerfile
    container_name: node
    volumes:
      - /var/lib/neemba/secrets:/var/lib/neemba/secrets:ro
    env_file:
      - .env.prod
    environment:
      # Pull from the rtmp container over the compose network instead of
      # hairpinning through the public domain (not a secret — safe to pin).
      RTMP_PULL_URL: rtmp://rtmp:1935/live/translation
    expose:
      - "3000"
    networks:
      - appnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  python:
    build:
      context: ./services/python
      dockerfile: Dockerfile
      target: prod
    container_name: python
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/lib/neemba/secrets:/var/lib/neemba/secrets:ro
    env_file:
      - .env.prod
    expose:
      - "8000"
    networks:
      - appnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nats:
    image: nats:2.10.17-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    container_name: nats
    env_file:
      - .env.prod
    expose:
      - "4222"
      # 8222 (HTTP monitoring, unauthenticated) is network-internal only:
      # the healthcheck below runs inside the container and still reaches it.
      - "8222"
    volumes:
      - nats-data:/data
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
      - appnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nats-box:
    image: synadia/nats-box:latest
    container_name: nats-box
    entrypoint: ["/bin/sh", "-lc"]
    command: ["sleep infinity"]
    env_file:
      - .env.prod
    networks:
      - appnet
    depends_on:
      - nats
    restart: unless-stopped

  pg-retention:
    image: postgres:16-alpine
    container_name: pg-retention
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
    volumes:
      - ./infra/postgres/retention.sh:/usr/local/bin/retention.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/retention.sh"]
    networks:
      - appnet
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pg-backup:
    build:
      context: ./infra/postgres
      dockerfile: backup.Dockerfile
    container_name: pg-backup
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      # Not secrets — safe to pin here. Credentials come from the EC2
      # instance profile (neemba-ec2-role) via IMDS, not from env.
      BACKUP_BUCKET: neemba-db-backups-989785488374
      AWS_DEFAULT_REGION: ap-northeast-2
    volumes:
      - ./infra/postgres/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    networks:
      - appnet
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    expose:
      - "5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - appnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 관측 스택. dev compose 에 있던 정의를 prod 관례로 옮긴 것이다(큐 14번).
  # ports 를 열지 않는다 — Prometheus 는 인증이 없어 9090 노출이 곧 메트릭 공개이고,
  # Grafana 는 nginx 의 auth_basic 뒤에만 둔다. 둘 다 appnet 내부로만 닿는다.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 명시하지 않으면 기본 15d 다. 디스크 여유(29G)에 비해 30d 는 넉넉하고,
      # 값을 코드에 박아야 몇 달 뒤 디스크로 문제가 오지 않는다.
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - appnet
    depends_on:
      - node
      - python
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 익명 Viewer 로 두는 것은 인증을 없애는 게 아니다 — nginx 의 auth_basic 이 앞을
  # 막으므로 여기 도달하려면 이미 통과한 뒤다. Grafana 자체 로그인을 켜면 사용자가
  # 비밀번호를 두 번 대야 하고 관리 지점이 둘로 갈린다.
  # ALLOW_EMBEDDING 은 외부 사이트 임베드도 허용하므로 nginx 에 CSP frame-ancestors
  # 'self' 를 함께 건다(infra/nginx/nginx.conf 의 /grafana/ 블록).
  grafana:
    image: grafana/grafana:11.5.1
    container_name: grafana
    # env_file 을 붙이지 않는다. .env.prod 는 DEEPL_API_KEY·POSTGRES_PASSWORD·
    # NATS_PASSWORD·RTMP_PUBLISH_KEY 등 파이프라인 비밀값 일습인데 Grafana 는
    # 그중 어느 것도 쓰지 않는다 — 서드파티 이미지에 넣을 이유가 없다.
    # 필요한 두 값만 ${} 로 집어온다(배포 명령이 --env-file .env.prod 를 넘긴다).
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?set in .env.prod}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set in .env.prod}
      GF_SERVER_ROOT_URL: "https://monitor.neemba.app/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - appnet
    depends_on:
      - prometheus
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
