worker_processes 1;
events { worker_connections 1024; }

http {
    # Correct Content-Type for the monitor static assets (css/js). Without this
    # .css is served as text/plain and browsers refuse the stylesheet.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream node {
        server node:3000;
    }

    upstream python {
        server python:8000;
    }

    # HTTP → HTTPS (ACME only on HTTP)
    server {
        listen 80;
        server_name neemba.app www.neemba.app;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name neemba.app www.neemba.app;

        ssl_certificate     /etc/letsencrypt/live/neemba.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/neemba.app/privkey.pem;

        client_max_body_size 20m;

        # Monitor history/search API → python (Phase 6).
        # NOTE: /api/ proxies to node; the monitor API lives in python:8000.
        # This is a more-specific prefix than /api/ so nginx matches it first.
        location /api/monitor/ {
            # Access control (Phase 7) — the monitor surfaces are unauthenticated
            # otherwise. htpasswd lives in the mounted secrets dir, never in git.
            auth_basic           "Neemba Monitor";
            auth_basic_user_file /var/lib/neemba/secrets/monitor.htpasswd;

            set $python_upstream python:8000;
            proxy_pass http://$python_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 30s;
        }

        # 슬래시 없는 /monitor 는 디렉터리가 아니라 파일로 해석돼 base URL 이 "/" 가
        # 된다. index.html 이 자산을 상대 경로로 참조하므로(style.css, app.js —
        # 도메인 분리 계획 때문에 상대 경로를 유지한다) 요청이 /style.css,
        # /app.js 로 새고, 아래 catch-all 이 200 "neemba" 를 돌려준다. 404 가
        # 아니라 200 이라 브라우저는 오류도 내지 않고, CSS 는 무시되고 JS 는
        # 첫 줄에서 ReferenceError 로 죽어 페이지가 통째로 먹통이 된다.
        # 정규화 리다이렉트로 base URL 을 /monitor/ 로 고정해 원인을 없앤다.
        location = /monitor {
            # 상대 리다이렉트(Location: /monitor/). 기본값인 절대 URL 은
            # $host 로 조립돼 비표준 포트가 빠진다 — dev(8080)에서 80 번으로
            # 튕긴다. 상대 경로면 브라우저가 현재 origin(포트 포함)에 붙인다.
            absolute_redirect off;
            return 301 /monitor/;
        }

        # Monitor static page (Phase 6) — vanilla HTML/CSS/JS, no build step.
        location /monitor {
            # Access control (Phase 7). Loading this page issues the Basic Auth
            # challenge; the browser then caches the credential for the origin.
            auth_basic           "Neemba Monitor";
            auth_basic_user_file /var/lib/neemba/secrets/monitor.htpasswd;

            root /var/www/html;
            try_files $uri $uri/ /monitor/index.html;

            # 배포해도 화면이 안 바뀌던 원인(2026-08-02 실측): 여기에 캐시 지시가
            # 없어 Chrome 이 Last-Modified 기반 휴리스틱 캐싱을 했다. WU5 를 배포한
            # 뒤에도 탭에는 옛 index.html·app.js 가 그대로 떠서 상태 칩 바와 순단
            # 이력 탭이 안 보였다(하드 리프레시로 확인).
            #
            # no-store 가 아니라 no-cache 인 이유: 캐시는 유지하되 매번 재검증만
            # 시킨다. 바뀐 게 없으면 ETag 로 304 가 오므로 본문 전송은 없고,
            # 페이지당 조건부 요청 3개(html·css·js)가 늘 뿐이다. 자산 파일명에
            # 해시를 붙이는 정석은 번들러가 필요해 D7("번들러 없음")과 충돌한다.
            add_header Cache-Control "no-cache" always;
        }

        # API → node
        location /api/ {
            set $node_upstream node:3000;
            proxy_pass http://$node_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 30s;
        }

        # Monitor live WebSocket → python (Phase 7 access control).
        # More-specific prefix than /ws so nginx matches it first; only this
        # monitor socket is authenticated, the client /ws below stays open.
        # The browser forwards the cached same-origin Basic credential (set when
        # /monitor was loaded) on this handshake, so no front-end change is
        # needed. See docs/monitoring-plan.md §0/§7 for the rationale + fallback.
        # Prefix also covers /ws/monitor/events (monitor-v2 WU1 global event
        # channel) — same routing + Basic Auth, no extra block needed.
        location /ws/monitor {
            auth_basic           "Neemba Monitor";
            auth_basic_user_file /var/lib/neemba/secrets/monitor.htpasswd;

            set $python_upstream python:8000;
            proxy_pass http://$python_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
        }

        # WebSocket → python (client-facing, unauthenticated — no regression)
        location /ws {
            set $python_upstream python:8000;
            proxy_pass http://$python_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
        }

        # nginx 헬스체크
        location /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        # 프론트 없음 → 그냥 살아있다는 응답만
        location / {
            default_type text/plain;
            return 200 "neemba\n";
        }
    }
}
