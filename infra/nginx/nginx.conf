worker_processes 1;
events { worker_connections 1024; }

http {
    # Correct Content-Type for the monitor static assets (css/js). Without this
    # .css is served as text/plain and browsers refuse the stylesheet.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream node {
        server node:3000;
    }

    upstream python {
        server python:8000;
    }

    # HTTP → HTTPS (ACME only on HTTP)
    server {
        listen 80;
        # monitor.neemba.app must be here BEFORE its cert exists: certbot's
        # HTTP-01 challenge for the SAN expansion is served from this block.
        server_name neemba.app www.neemba.app monitor.neemba.app;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name neemba.app www.neemba.app;

        ssl_certificate     /etc/letsencrypt/live/neemba.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/neemba.app/privkey.pem;

        client_max_body_size 20m;

        # Monitor history/search API → python (Phase 6).
        # NOTE: /api/ proxies to node; the monitor API lives in python:8000.
        # This is a more-specific prefix than /api/ so nginx matches it first.
        location /api/monitor/ {
            # Access control (Phase 7) — the monitor surfaces are unauthenticated
            # otherwise. htpasswd lives in the mounted secrets dir, never in git.
            auth_basic           "Neemba Monitor";
            auth_basic_user_file /var/lib/neemba/secrets/monitor.htpasswd;

            set $python_upstream python:8000;
            proxy_pass http://$python_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 30s;
        }

        # Monitor moved to monitor.neemba.app (server block below). Capture
        # keeps deep paths working: an old cached index.html requesting
        # /monitor/style.css lands on /style.css of the new origin — the right
        # file — instead of the new root. /api/monitor·/ws/monitor stay on this
        # origin too so a stale cached page keeps working until it revalidates
        # (the page shipped with Cache-Control: no-cache, so that is one load).
        location ~ ^/monitor(/.*)?$ {
            # $is_args$args: `return` (unlike `rewrite ... permanent`) does not
            # re-append the query string — without it deep links lose params.
            return 301 https://monitor.neemba.app$1$is_args$args;
        }

        # Mic fallback → node (HTTP start/stop/tts + the audio WebSocket).
        # The /api/ catch-all below already passes the HTTP calls through, but
        # it has no Upgrade headers and a 30s read timeout — the mic audio
        # socket needs both. More-specific prefix, so nginx matches it first.
        # Ported from dev (infra/nginx/dev/nginx.conf); prerequisite was the
        # session-slot split (docs/mic-rtmp-session-slot-plan.md §7) — before
        # it, starting the mic killed the RTMP broadcast's captions.
        location /api/mic {
            set $node_upstream node:3000;
            proxy_pass http://$node_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
        }

        # API → node
        location /api/ {
            set $node_upstream node:3000;
            proxy_pass http://$node_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 30s;
        }

        # Monitor live WebSocket → python (Phase 7 access control).
        # More-specific prefix than /ws so nginx matches it first; only this
        # monitor socket is authenticated, the client /ws below stays open.
        # The browser forwards the cached same-origin Basic credential (set when
        # /monitor was loaded) on this handshake, so no front-end change is
        # needed. See docs/monitoring-plan.md §0/§7 for the rationale + fallback.
        # Prefix also covers /ws/monitor/events (monitor-v2 WU1 global event
        # channel) — same routing + Basic Auth, no extra block needed.
        location /ws/monitor {
            auth_basic           "Neemba Monitor";
            auth_basic_user_file /var/lib/neemba/secrets/monitor.htpasswd;

            set $python_upstream python:8000;
            proxy_pass http://$python_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
        }

        # WebSocket → python (client-facing, unauthenticated — no regression)
        location /ws {
            set $python_upstream python:8000;
            proxy_pass http://$python_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
        }

        # nginx 헬스체크
        location /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        # 프론트 없음 → 그냥 살아있다는 응답만
        location / {
            default_type text/plain;
            return 200 "neemba\n";
        }
    }

    # Monitor dashboard on its own origin. Same cert (the neemba.app lineage,
    # SAN-expanded to include this name), same htpasswd, same webroot mount —
    # only the origin changes. The page's assets are relative and its API
    # calls are root-absolute (/api/monitor, /ws/monitor), which is exactly
    # the layout this block provides, so the frontend ships unchanged.
    server {
        listen 443 ssl;
        server_name monitor.neemba.app;

        ssl_certificate     /etc/letsencrypt/live/neemba.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/neemba.app/privkey.pem;

        # Server-level: every surface here is operator-only, including the
        # proxied API/WS — there is no unauthenticated path on this origin.
        auth_basic           "Neemba Monitor";
        auth_basic_user_file /var/lib/neemba/secrets/monitor.htpasswd;

        # History/search API → python (same wiring as the main origin).
        location /api/monitor/ {
            set $python_upstream python:8000;
            proxy_pass http://$python_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 30s;
        }

        # Grafana → same origin, so the server-level auth_basic above is the
        # only login. Grafana itself runs anonymous-Viewer: turning on its own
        # login would ask the operator for a second password and split the
        # credential store in two.
        #
        # No trailing URI on proxy_pass: the prefix is passed through as-is and
        # Grafana serves it via GF_SERVER_SERVE_FROM_SUB_PATH. Stripping it here
        # would break every asset URL Grafana emits.
        #
        # ALLOW_EMBEDDING is on so the monitor page can iframe panels; that flag
        # allows ANY site to frame Grafana, so this CSP is the actual boundary.
        # 끝 슬래시 없는 /grafana 는 prefix 매칭에 안 걸려 아래 location / 의
        # SPA 로 떨어진다(모니터 페이지가 200 으로 응답). 사람이 손으로 치거나
        # 링크로 거는 형태가 그쪽이므로 명시적으로 넘긴다.
        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            set $grafana_upstream grafana:3000;
            proxy_pass http://$grafana_upstream;

            proxy_http_version 1.1;
            # Grafana Live pushes over WebSocket; without these it degrades to
            # polling and the panels look frozen.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            add_header Content-Security-Policy "frame-ancestors 'self'" always;
        }

        # Live monitor WebSocket → python. Prefix also covers
        # /ws/monitor/events (global event channel).
        location /ws/monitor {
            set $python_upstream python:8000;
            proxy_pass http://$python_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
        }

        # Static page at the origin root, reusing the same webroot mount.
        # no-cache (not no-store): revalidate every load via ETag/304 — the
        # 2026-08-02 stale-page incident, without giving up caching entirely.
        location / {
            root /var/www/html/monitor;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
